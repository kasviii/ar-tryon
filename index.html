<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACE BOOTH</title>
<link href="https://fonts.googleapis.com/css2?family=Syne+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0d;--panel:#141414;--border:#2a2a2a;
  --green:#00ff88;--yellow:#ffe94d;--red:#ff3c5a;--blue:#4de8ff;--pink:#ff6fff;
  --white:#f0f0f0;--dim:#555;
  --font-mono:'Syne Mono',monospace;--font-sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--white);font-family:var(--font-sans);min-height:100vh;overflow:hidden;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5;}

.app{display:grid;grid-template-columns:1fr 300px;height:100vh;}

/* STAGE */
.stage{position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
.stage-corner{position:absolute;width:20px;height:20px;z-index:10;pointer-events:none;}
.stage-corner.tl{top:16px;left:16px;border-top:2px solid var(--green);border-left:2px solid var(--green);}
.stage-corner.tr{top:16px;right:16px;border-top:2px solid var(--green);border-right:2px solid var(--green);}
.stage-corner.bl{bottom:16px;left:16px;border-bottom:2px solid var(--green);border-left:2px solid var(--green);}
.stage-corner.br{bottom:16px;right:16px;border-bottom:2px solid var(--green);border-right:2px solid var(--green);}
#videoEl{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;}
#outputCanvas{position:absolute;width:100%;height:100%;object-fit:cover;cursor:crosshair;}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;transition:opacity 0.05s;}
.flash.go{opacity:1;}
.countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:100px;font-weight:800;color:#fff;text-shadow:0 0 40px rgba(255,255,255,0.6);opacity:0;z-index:30;pointer-events:none;}
.countdown.show{opacity:1;}
.gesture-label{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:12px;color:var(--green);letter-spacing:2px;padding:5px 14px;border:1px solid var(--green);background:rgba(0,255,136,0.06);opacity:0;transition:opacity 0.3s;z-index:20;white-space:nowrap;}
.gesture-label.show{opacity:1;}
.draw-mode-badge{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;padding:3px 12px;border:1px solid var(--blue);color:var(--blue);z-index:20;letter-spacing:2px;}

/* SIDEBAR */
.sidebar{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);}
.sidebar-header{padding:18px 18px 14px;border-bottom:1px solid var(--border);}
.logo{font-size:20px;font-weight:800;letter-spacing:-1px;}
.logo span{color:var(--green);}
.logo-sub{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:2px;margin-top:3px;}
.section{padding:14px 18px;border-bottom:1px solid var(--border);}
.section-title{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:3px;margin-bottom:10px;}

/* STRIP THEMES */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.theme-btn{background:var(--bg);border:1px solid var(--border);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.15s;border-radius:2px;}
.theme-btn:hover{border-color:var(--dim);}
.theme-btn.active{border-color:var(--yellow);background:rgba(255,233,77,0.05);}
.theme-preview{width:100%;height:44px;border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;overflow:hidden;}
.theme-name{font-family:var(--font-mono);font-size:8px;color:var(--dim);letter-spacing:1px;}
.theme-btn.active .theme-name{color:var(--yellow);}

/* DRAW TOOLS */
.palette{display:flex;gap:5px;flex-wrap:wrap;}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
.color-dot.active{border-color:var(--white);transform:scale(1.15);}
.brush-row{display:flex;gap:5px;align-items:center;margin-top:8px;}
.brush-btn{width:34px;height:34px;background:var(--bg);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;border-radius:2px;}
.brush-btn.active{border-color:var(--green);}
.brush-dot{background:var(--white);border-radius:50%;}
.clear-draw-btn{margin-top:8px;width:100%;padding:7px;background:transparent;border:1px solid var(--border);color:var(--dim);font-family:var(--font-mono);font-size:8px;cursor:pointer;letter-spacing:2px;transition:all 0.15s;}
.clear-draw-btn:hover{border-color:var(--red);color:var(--red);}

/* FILTER */
.filter-row{display:flex;gap:5px;}
.filter-btn{flex:1;padding:6px 2px;background:var(--bg);border:1px solid var(--border);color:var(--dim);font-family:var(--font-mono);font-size:7px;cursor:pointer;transition:all 0.15s;letter-spacing:1px;}
.filter-btn.active{border-color:var(--yellow);color:var(--yellow);}

/* CAPTURE */
.snap-btn{width:100%;padding:11px;background:transparent;border:1px solid var(--green);color:var(--green);font-family:var(--font-mono);font-size:9px;cursor:pointer;letter-spacing:3px;transition:all 0.15s;margin-bottom:7px;}
.snap-btn:hover{background:rgba(0,255,136,0.07);}
.booth-btn{width:100%;padding:11px;background:transparent;border:1px solid var(--pink);color:var(--pink);font-family:var(--font-mono);font-size:9px;cursor:pointer;letter-spacing:3px;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.booth-btn:hover{background:rgba(255,111,255,0.07);}
.booth-btn.recording{border-color:var(--red);color:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* GESTURE GUIDE */
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.g-item{display:flex;align-items:center;gap:5px;padding:4px 0;}
.g-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0;}
.g-text{font-family:var(--font-mono);font-size:7px;color:var(--dim);line-height:1.5;}
.g-text b{color:var(--white);display:block;}

/* STRIP PREVIEW */
.strip-wrap{padding:14px 18px;}
.strip-title{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:3px;margin-bottom:8px;}
.strip-slots{display:flex;flex-direction:column;gap:3px;}
.strip-slot{width:100%;aspect-ratio:4/3;background:#0a0a0a;border:1px solid #1a1a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.strip-slot canvas{width:100%;height:100%;object-fit:cover;}
.slot-num{font-family:var(--font-mono);font-size:10px;color:#2a2a2a;}
.strip-actions{display:flex;gap:6px;margin-top:10px;}
.dl-btn{flex:1;padding:9px;background:transparent;border:1px solid var(--yellow);color:var(--yellow);font-family:var(--font-mono);font-size:8px;cursor:pointer;letter-spacing:2px;transition:all 0.15s;}
.dl-btn:hover{background:rgba(255,233,77,0.07);}
.clr-btn{flex:1;padding:9px;background:transparent;border:1px solid var(--border);color:var(--dim);font-family:var(--font-mono);font-size:8px;cursor:pointer;letter-spacing:2px;transition:all 0.15s;}
.clr-btn:hover{border-color:var(--red);color:var(--red);}

.status-row{display:flex;align-items:center;gap:7px;padding:10px 18px;border-top:1px solid var(--border);margin-top:auto;}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--red);}
.status-dot.on{background:var(--green);animation:pulse 2s infinite;}
.status-txt{font-family:var(--font-mono);font-size:8px;color:var(--dim);}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="stage-corner tl"></div><div class="stage-corner tr"></div>
    <div class="stage-corner bl"></div><div class="stage-corner br"></div>
    <video id="videoEl" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
    <div class="flash" id="flash"></div>
    <div class="countdown" id="countdown"></div>
    <div class="gesture-label" id="gestureLabel"></div>
    <div class="draw-mode-badge" id="drawBadge">✏ DRAW MODE</div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">FACE<span>BOOTH</span></div>
      <div class="logo-sub">DRAW · CAPTURE · PRINT</div>
    </div>

    <!-- STRIP THEMES -->
    <div class="section">
      <div class="section-title">STRIP TEMPLATE</div>
      <div class="theme-grid" id="themeGrid">
        <button class="theme-btn active" onclick="setTheme('film',this)">
          <div class="theme-preview" style="background:#111;border:2px solid #333;font-size:11px;color:#888;">🎞 FILM</div>
          <div class="theme-name">3 SHOTS</div>
        </button>
        <button class="theme-btn" onclick="setTheme('purple',this)">
          <div class="theme-preview" style="background:#e8d5f5;font-size:11px;color:#7b5ea7;">☁️ PURPLE</div>
          <div class="theme-name">3 SHOTS</div>
        </button>
        <button class="theme-btn" onclick="setTheme('y2k',this)">
          <div class="theme-preview" style="background:#fce4e4;font-size:11px;color:#b06070;">🎮 Y2K</div>
          <div class="theme-name">3 SHOTS</div>
        </button>
        <button class="theme-btn" onclick="setTheme('floral',this)">
          <div class="theme-preview" style="background:#fde8e0;font-size:11px;color:#b06060;">🌸 FLORAL</div>
          <div class="theme-name">4 SHOTS</div>
        </button>
      </div>
    </div>

    <!-- DRAW -->
    <div class="section">
      <div class="section-title">DRAW ON CAMERA</div>
      <div class="palette" id="palette"></div>
      <div class="brush-row" id="brushRow">
        <button class="brush-btn active" onclick="setBrush(3,this)"><div class="brush-dot" style="width:3px;height:3px"></div></button>
        <button class="brush-btn" onclick="setBrush(6,this)"><div class="brush-dot" style="width:6px;height:6px"></div></button>
        <button class="brush-btn" onclick="setBrush(12,this)"><div class="brush-dot" style="width:12px;height:12px"></div></button>
        <button class="brush-btn" onclick="setBrush(22,this)"><div class="brush-dot" style="width:18px;height:18px"></div></button>
      </div>
      <button class="clear-draw-btn" onclick="clearDraw()">✕ CLEAR DRAWING</button>
    </div>

    <!-- FILTER -->
    <div class="section">
      <div class="section-title">FILTER</div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('normal',this)">NORMAL</button>
        <button class="filter-btn" onclick="setFilter('bw',this)">B&W</button>
        <button class="filter-btn" onclick="setFilter('vintage',this)">VINTAGE</button>
        <button class="filter-btn" onclick="setFilter('neon',this)">NEON</button>
      </div>
    </div>

    <!-- CAPTURE -->
    <div class="section">
      <div class="section-title">CAPTURE</div>
      <button class="snap-btn" onclick="takeSnap()">📸 SINGLE SHOT</button>
      <button class="booth-btn" id="boothBtn" onclick="startBooth()">🎞 PHOTOBOOTH STRIP (3 shots)</button>
    </div>

    <!-- GESTURE GUIDE -->
    <div class="section">
      <div class="section-title">HAND GESTURES</div>
      <div class="g-grid">
        <div class="g-item"><div class="g-icon">✊</div><div class="g-text"><b>BOOTH</b>fist → 2s → 3 shots</div></div>
        <div class="g-item"><div class="g-icon">👍</div><div class="g-text"><b>SNAP</b>thumbs up</div></div>
        <div class="g-item"><div class="g-icon">🖱️</div><div class="g-text"><b>DRAW</b>click & drag</div></div>
        <div class="g-item"><div class="g-icon">🖐️</div><div class="g-text"><b>CLEAR</b>open palm</div></div>
      </div>
    </div>

    <!-- STRIP PREVIEW -->
    <div class="strip-wrap">
      <div class="strip-title">STRIP PREVIEW</div>
      <div class="strip-slots" id="stripSlots">
        <div class="strip-slot" id="slot0"><span class="slot-num">01</span></div>
        <div class="strip-slot" id="slot1"><span class="slot-num">02</span></div>
        <div class="strip-slot" id="slot2"><span class="slot-num">03</span></div>
        <div class="strip-slot" id="slot3" style="display:none"><span class="slot-num">04</span></div>
      </div>
      <div class="strip-actions">
        <button class="dl-btn" onclick="downloadStrip()">↓ SAVE STRIP</button>
        <button class="clr-btn" onclick="clearStrip()">✕ CLEAR</button>
      </div>
    </div>

    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-txt" id="statusTxt">LOADING...</div>
    </div>
  </div>
</div>

<script type="module">
import { FaceLandmarker, HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

// ── ELEMENTS ─────────────────────────────────────────
const video   = document.getElementById('videoEl');
const canvas  = document.getElementById('outputCanvas');
const ctx     = canvas.getContext('2d');
const flash   = document.getElementById('flash');
const cdEl    = document.getElementById('countdown');
const gLabel  = document.getElementById('gestureLabel');
const drawBadge = document.getElementById('drawBadge');

// ── STATE ─────────────────────────────────────────────
let handLandmarker = null, faceLandmarker = null;
let curColor  = '#ff3c5a', brushSize = 3, curFilter = 'normal', curTheme = 'film';
let boothRunning = false, stripShots = [null,null,null];
let gestureHold = {}, smoothFace = null;
const HOLD_MS = 500, SMOOTH = 0.4;

// draw canvas (persistent layer)
const drawCanvas = document.createElement('canvas');
const dctx = drawCanvas.getContext('2d');
let isDrawing = false, lastDX = null, lastDY = null;

// ── PALETTE ───────────────────────────────────────────
const COLORS = ['#ff3c5a','#ff6fff','#ffe94d','#00ff88','#4de8ff','#ffffff','#ff8800','#aa66ff'];
const paletteEl = document.getElementById('palette');
COLORS.forEach((c,i)=>{
  const d = document.createElement('div');
  d.className='color-dot'+(i===0?' active':'');
  d.style.background=c;
  d.onclick=()=>{ document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('active')); d.classList.add('active'); curColor=c; };
  paletteEl.appendChild(d);
});

// ── MOUSE/TOUCH DRAW ──────────────────────────────────
function getPos(e, canvas) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x:(clientX-r.left)*scaleX, y:(clientY-r.top)*scaleY };
}
canvas.addEventListener('mousedown', e=>{ isDrawing=true; const p=getPos(e,canvas); lastDX=p.x; lastDY=p.y; });
canvas.addEventListener('mousemove', e=>{
  if(!isDrawing) return;
  const p=getPos(e,canvas);
  dctx.strokeStyle=curColor; dctx.lineWidth=brushSize; dctx.lineCap='round'; dctx.lineJoin='round';
  dctx.beginPath(); dctx.moveTo(lastDX,lastDY); dctx.lineTo(p.x,p.y); dctx.stroke();
  lastDX=p.x; lastDY=p.y;
});
canvas.addEventListener('mouseup', ()=>{ isDrawing=false; lastDX=lastDY=null; });
canvas.addEventListener('mouseleave', ()=>{ isDrawing=false; lastDX=lastDY=null; });
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); isDrawing=true; const p=getPos(e,canvas); lastDX=p.x; lastDY=p.y; },{passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault();
  if(!isDrawing) return;
  const p=getPos(e,canvas);
  dctx.strokeStyle=curColor; dctx.lineWidth=brushSize; dctx.lineCap='round'; dctx.lineJoin='round';
  dctx.beginPath(); dctx.moveTo(lastDX,lastDY); dctx.lineTo(p.x,p.y); dctx.stroke();
  lastDX=p.x; lastDY=p.y;
},{passive:false});
canvas.addEventListener('touchend', ()=>{ isDrawing=false; });

// ── MEDIAPIPE INIT ────────────────────────────────────
async function initMP() {
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm");
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU" },
    runningMode:"VIDEO", numHands:1,
  });
  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:"GPU" },
    runningMode:"VIDEO", numFaces:1,
  });
  await startCamera();
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720},audio:false});
    video.srcObject = stream;
    video.onloadedmetadata = ()=>{
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      drawCanvas.width=video.videoWidth; drawCanvas.height=video.videoHeight;
      document.getElementById('statusDot').classList.add('on');
      document.getElementById('statusTxt').textContent='CAMERA ACTIVE';
      requestAnimationFrame(loop);
    };
  } catch(e){ document.getElementById('statusTxt').textContent='CAMERA ERROR'; }
}

// ── MAIN LOOP ─────────────────────────────────────────
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastT<33) return; lastT=ts;
  if(video.readyState<2) return;
  const now=performance.now();

  const hRes = handLandmarker.detectForVideo(video,now);
  const fRes = faceLandmarker.detectForVideo(video,now);

  // draw mirrored video
  ctx.save(); ctx.scale(-1,1); ctx.translate(-canvas.width,0);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();

  applyFilter();

  // draw layer
  ctx.drawImage(drawCanvas,0,0);

  // hand gestures
  if(hRes?.landmarks?.length){
    const lm = hRes.landmarks[0].map(p=>({x:(1-p.x)*canvas.width, y:p.y*canvas.height}));
    drawSkeleton(lm);
    processGesture(lm);
  } else {
    Object.keys(gestureHold).forEach(k=>delete gestureHold[k]);
  }
}

// ── FILTER ────────────────────────────────────────────
function applyFilter(){
  if(curFilter==='normal') return;
  const id=ctx.getImageData(0,0,canvas.width,canvas.height), d=id.data;
  if(curFilter==='bw'){ for(let i=0;i<d.length;i+=4){const g=(d[i]+d[i+1]+d[i+2])/3;d[i]=d[i+1]=d[i+2]=g;} }
  else if(curFilter==='vintage'){ for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]*1.1+20);d[i+1]=Math.min(255,d[i+1]*0.9+10);d[i+2]=Math.min(255,d[i+2]*0.7);} }
  else if(curFilter==='neon'){ for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]*1.3);d[i+1]=Math.min(255,d[i+1]*0.7);d[i+2]=Math.min(255,d[i+2]*1.5);} }
  ctx.putImageData(id,0,0);
}

// ── SKELETON ──────────────────────────────────────────
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawSkeleton(pts){
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1;
  CONN.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y);ctx.stroke();});
  pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle='rgba(0,255,136,0.6)';ctx.fill();});
  ctx.restore();
}

// ── GESTURE ───────────────────────────────────────────
function fUp(lm,tip,mcp){return lm[tip].y<lm[mcp].y;}
function detectGesture(lm){
  const idx=fUp(lm,8,5),mid=fUp(lm,12,9),ring=fUp(lm,16,13),pink=fUp(lm,20,17);
  const thumbUp=lm[4].y<lm[3].y-15;
  if(idx&&mid&&ring&&pink)              return 'clear';
  if(thumbUp&&!idx&&!mid&&!ring&&!pink) return 'snap';
  if(!idx&&!mid&&!ring&&!pink&&!thumbUp) return 'fist';
  return 'idle';
}
function heldFor(name,ms=HOLD_MS){
  const now=Date.now();
  if(!gestureHold[name]){gestureHold[name]={start:now,fired:false};return false;}
  if(gestureHold[name].fired) return false;
  if(now-gestureHold[name].start>=ms){gestureHold[name].fired=true;return true;}
  return false;
}
function processGesture(lm){
  const g=detectGesture(lm);
  ['snap','fist','clear'].forEach(n=>{if(g!==n)delete gestureHold[n];});
  if(g==='snap'&&heldFor('snap')&&!boothRunning){ takeSnap(); showLabel('👍 SNAP!'); }
  else if(g==='fist'&&heldFor('fist',400)&&!boothRunning){ startBooth(); showLabel('✊ BOOTH STARTING!'); }
  else if(g==='clear'&&heldFor('clear')){ dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height); showLabel('🖐 CLEARED'); }
}

let glT;
function showLabel(txt){
  gLabel.textContent=txt; gLabel.classList.add('show');
  clearTimeout(glT); glT=setTimeout(()=>gLabel.classList.remove('show'),1500);
}

// ── CAPTURE ───────────────────────────────────────────
function captureFrame(){
  const s=document.createElement('canvas'); s.width=canvas.width; s.height=canvas.height;
  s.getContext('2d').drawImage(canvas,0,0); return s;
}
function doFlash(){ flash.classList.add('go'); setTimeout(()=>flash.classList.remove('go'),120); }

function takeSnap(){
  doFlash();
  const snap=captureFrame();
  const idx=stripShots.findIndex(s=>s===null);
  if(idx!==-1){ stripShots[idx]=snap; renderSlot(idx,snap); }
  else{ stripShots.shift(); stripShots.push(snap); [0,1,2].forEach(i=>renderSlot(i,stripShots[i])); }
}

function renderSlot(i,snap){
  const slot=document.getElementById(`slot${i}`); slot.innerHTML='';
  const c=document.createElement('canvas'); c.width=snap.width; c.height=snap.height;
  c.getContext('2d').drawImage(snap,0,0); slot.appendChild(c);
}

async function startBooth(){
  if(boothRunning) return;
  boothRunning=true;
  const n = getShotCount();
  showLabel('✊ GET READY...');
  const btn=document.getElementById('boothBtn');
  btn.classList.add('recording'); btn.textContent=`🔴 SHOOTING ${n} SHOTS...`;
  stripShots=Array(n).fill(null);
  // show/hide slot 4
  document.getElementById('slot3').style.display = n>=4 ? 'block' : 'none';
  for(let i=0;i<n;i++){
    document.getElementById(`slot${i}`).innerHTML=`<span class="slot-num">0${i+1}</span>`;
  }
  await sleep(2000);
  for(let i=0;i<n;i++){
    doFlash();
    stripShots[i]=captureFrame(); renderSlot(i,stripShots[i]);
    showLabel(`📸 ${i+1} of ${n}`);
    await sleep(i<n-1 ? 800 : 300);
  }
  boothRunning=false; btn.classList.remove('recording'); btn.textContent=`🎞 PHOTOBOOTH STRIP (${n} shots)`;
  showLabel('🎞 STRIP DONE!');
}

function countdown(from){
  return new Promise(res=>{
    let n=from; cdEl.textContent=n; cdEl.classList.add('show');
    const iv=setInterval(()=>{ n--; if(n<=0){clearInterval(iv);cdEl.classList.remove('show');res();}else{cdEl.textContent=n;} },1000);
  });
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// ── STRIP TEMPLATES ──────────────────────────────────
// Slot coords: [x, y, w, h] as fractions of template image size
const TEMPLATES = {
  film:   { file:'frames/Black_and_White_Film_Frame_Photo_Collage_Instagram_Post.png',   shots:3, W:1080, H:1080,
            slots:[ [39,0,502,635], [39,441,502,194], [39,676,502,404] ] },
  purple: { file:'frames/Purple_Cute_Today_s_Special_Photostrip.png', shots:3, W:591, H:1772,
            slots:[ [30,30,531,385], [30,561,531,323], [30,986,531,408] ] },
  y2k:    { file:'frames/Pink_and_Green_Playful_Photo_Strip_Design.png', shots:3, W:707, H:2000,
            slots:[ [54,217,599,407], [54,789,599,411], [54,1380,599,400] ] },
  floral: { file:'frames/Beige_and_White_Aesthetic_Flower_Girl_Friends_Photobox_Photo_Strip.png', shots:4, W:591, H:1772,
            slots:[ [30,88,531,294], [30,482,531,287], [30,869,531,289], [30,1256,531,287] ] }
};

function getShotCount(){ return TEMPLATES[curTheme]?.shots || 3; }

async function downloadStrip(){
  const tmpl = TEMPLATES[curTheme];
  const filled = stripShots.filter(Boolean);
  if(!filled.length){ alert('No shots yet!'); return; }

  // Load template image
  const tImg = await loadImage(tmpl.file);
  const TW = tmpl.W, TH = tmpl.H;

  const out = document.createElement('canvas');
  out.width = TW; out.height = TH;
  const octx = out.getContext('2d');

  // Draw white base
  octx.fillStyle = '#fff';
  octx.fillRect(0,0,TW,TH);

  // Place photos into slots
  tmpl.slots.forEach(([sx,sy,sw,sh], i) => {
    const shot = stripShots[i];
    if(!shot) return;
    octx.save();
    octx.beginPath();
    octx.rect(sx, sy, sw, sh);
    octx.clip();
    // fit photo covering the slot (center crop)
    const shotAR = shot.width / shot.height;
    const slotAR = sw / sh;
    let dw, dh, dx, dy;
    if(shotAR > slotAR){ dh=sh; dw=sh*shotAR; dx=sx-(dw-sw)/2; dy=sy; }
    else { dw=sw; dh=sw/shotAR; dx=sx; dy=sy-(dh-sh)/2; }
    octx.drawImage(shot, dx, dy, dw, dh);
    octx.restore();
  });

  // Draw template on top
  octx.drawImage(tImg, 0, 0, TW, TH);

  const a = document.createElement('a');
  a.href = out.toDataURL('image/png');
  a.download = `facebooth-${curTheme}.png`;
  a.click();
}

function loadImage(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}

function drawStar(ctx,cx,cy,r,color){
  ctx.save(); ctx.translate(cx,cy); ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<5;i++){ ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*r,-Math.sin((18+i*72)*Math.PI/180)*r); ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*r*0.4,-Math.sin((54+i*72)*Math.PI/180)*r*0.4); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

window.setTheme=(t,btn)=>{
  curTheme=t;
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const n=getShotCount();
  document.getElementById('boothBtn').textContent=`🎞 PHOTOBOOTH STRIP (${n} shots)`;
  document.getElementById('slot3').style.display = n>=4 ? 'block' : 'none';
};
window.setBrush=(s,btn)=>{
  brushSize=s;
  document.querySelectorAll('.brush-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
};
window.setFilter=(f,btn)=>{
  curFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
};
window.clearDraw=()=>dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
window.takeSnap=takeSnap;
window.startBooth=startBooth;
window.downloadStrip=downloadStrip;
window.clearStrip=()=>{ const n=getShotCount(); stripShots=Array(n).fill(null); for(let i=0;i<4;i++){const el=document.getElementById(`slot${i}`);if(i<n){el.style.display='block';el.innerHTML=`<span class="slot-num">0${i+1}</span>`;}else{el.style.display='none';}} };

// ── BOOT ──────────────────────────────────────────────
initMP().catch(e=>{ document.getElementById('statusTxt').textContent='LOAD FAILED'; console.error(e); });
